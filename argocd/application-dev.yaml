apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hrms-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DevNetMohamed/HR-Management-System.git
    targetRevision: ci-jenkins
    path: hrms
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hrms
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
