# Overrides for prod (promote the tag manually or via PR)
replicaCount: 3

image:
  tag: "5c20b027361c"

ingress:
  hosts:
    - host: hrms.example.com
      paths:
        - path: /
          pathType: Prefix

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 1Gi
