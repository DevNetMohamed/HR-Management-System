services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    build:
      context: ./backend
      target: build
    command: node ./node_modules/typeorm/cli.js migration:run -d dist/infrastructure/database/data-source.js
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-hrms-backend:latest}
    restart: unless-stopped
    env_file: .env.ci
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      PORT: "9090"
    ports:
      - "0:9090"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  e2e:
    build:
      context: ./backend
      target: build
    profiles: ["test"]
    command: pnpm exec jest --config ./test/jest-e2e.json --runInBand
    env_file: .env.ci
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  pgdata: